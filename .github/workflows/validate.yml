name: Rules and package validation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build and verify archive round trip
        run: python tools/build.py
      - name: Run rule and mock adapter tests (no game runtime)
        run: python -m pytest -q tests
      - name: Check committed package reproducibility
        run: git diff --exit-code -- EvergrowthRing.pak BUILD_MANIFEST.json source/
